name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: games/snakes-and-ladders/test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t snakes-doodle:ci .
      - name: smoke test
        run: |
          docker run -d --name snl -p 2567:2567 snakes-doodle:ci
          for i in $(seq 1 20); do curl -sf http://localhost:2567/__healthcheck && break; sleep 1; done
          curl -sf http://localhost:2567/ | grep -q "<title>"
          curl -sf -X POST -H 'content-type: application/json' -d '{"boardId":"quick-doodle"}' http://localhost:2567/matchmake/create/game | grep -q roomId
